<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>فهّمني — حملة مقارنة الانتخابات التشريعية</title>
    <link rel="stylesheet" href="campaign.css">
    <script src="campaign.js" defer></script>
</head>
<body>
<main class="campaign-sheet" aria-label="حملة فهّمني لمقارنة الانتخابات التشريعية">
    <article class="campaign-card x-card" id="campaign-01-overview"
             data-export-width="1600" data-export-height="900" data-ready="false"
             aria-label="نظرة عامة على أرشيف الانتخابات">
        <div class="card-shell">
            <header class="campaign-header">
                <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                     alt="فهّمني">
                <span class="asset-index"><bdi>01</bdi> / <bdi>06</bdi></span>
            </header>
            <section class="campaign-body" data-campaign-body></section>
            <div class="campaign-signature"><bdi>fhemni.ma</bdi></div>
        </div>
    </article>

    <article class="campaign-card x-card" id="campaign-02-parties"
             data-export-width="1600" data-export-height="900" data-ready="false"
             aria-label="مكاسب وخسائر الأحزاب">
        <div class="card-shell">
            <header class="campaign-header">
                <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                     alt="فهّمني">
                <span class="asset-index"><bdi>02</bdi> / <bdi>06</bdi></span>
            </header>
            <section class="campaign-body" data-campaign-body></section>
            <div class="campaign-signature"><bdi>fhemni.ma</bdi></div>
        </div>
    </article>

    <article class="campaign-card x-card" id="campaign-03-transhumance"
             data-export-width="1600" data-export-height="900" data-ready="false"
             aria-label="الترحال السياسي بين 2021 و2026">
        <div class="card-shell">
            <header class="campaign-header">
                <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                     alt="فهّمني">
                <span class="asset-index"><bdi>03</bdi> / <bdi>06</bdi></span>
            </header>
            <section class="campaign-body" data-campaign-body></section>
            <div class="campaign-signature"><bdi>fhemni.ma</bdi></div>
        </div>
    </article>

    <article class="campaign-card x-card" id="campaign-04-regions"
             data-export-width="1600" data-export-height="900" data-ready="false"
             aria-label="تحولات المقاعد المحلية في الدار البيضاء سطات">
        <div class="card-shell">
            <header class="campaign-header">
                <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                     alt="فهّمني">
                <span class="asset-index"><bdi>04</bdi> / <bdi>06</bdi></span>
            </header>
            <section class="campaign-body" data-campaign-body></section>
            <div class="campaign-signature"><bdi>fhemni.ma</bdi></div>
        </div>
    </article>

    <article class="campaign-card x-card" id="campaign-05-profiles"
             data-export-width="1600" data-export-height="900" data-ready="false"
             aria-label="خصائص المنتخبين والمنتخبات">
        <div class="card-shell">
            <header class="campaign-header">
                <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                     alt="فهّمني">
                <span class="asset-index"><bdi>05</bdi> / <bdi>06</bdi></span>
            </header>
            <section class="campaign-body" data-campaign-body></section>
            <div class="campaign-signature"><bdi>fhemni.ma</bdi></div>
        </div>
    </article>

    <article class="campaign-card x-card" id="campaign-06-quotient"
             data-export-width="1600" data-export-height="900" data-ready="false"
             aria-label="محاكاة القاسم الانتخابي">
        <div class="card-shell">
            <header class="campaign-header">
                <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                     alt="فهّمني">
                <span class="asset-index"><bdi>06</bdi> / <bdi>06</bdi></span>
            </header>
            <section class="campaign-body" data-campaign-body></section>
            <div class="campaign-signature"><bdi>fhemni.ma</bdi></div>
        </div>
    </article>

    <article class="campaign-card story-card" id="campaign-story"
             data-export-width="1080" data-export-height="1920" data-ready="false"
             aria-label="ملخص ستوري لمقارنة الانتخابات">
        <header class="story-header">
            <img class="campaign-logo" src="../../../src/main/resources/static/assets/brand/fhemni-logo.png"
                 alt="فهّمني">
            <span class="story-kicker">مقارنة الانتخابات التشريعية</span>
        </header>
        <section class="campaign-body story-safe-area" data-campaign-body></section>
    </article>
</main>
</body>
</html>
