spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # Tomcat's native valve accepts forwarded client addresses only from its
  # internal/trusted proxy ranges instead of trusting client-supplied headers.
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
  servlet:
    session:
      cookie:
        secure: true

fhemni:
  civic:
    position-seed: ${FHEMNI_CIVIC_POSITION_SEED:classpath:data/civic-party-positions-2026-v1.json}
  cost-control:
    # Production AI spend is opt-in. Set both variables deliberately after configuring a project spend cap.
    analysis-enabled: ${FHEMNI_ANALYSIS_ENABLED:false}
    chat-enabled: ${FHEMNI_CHAT_ENABLED:false}
