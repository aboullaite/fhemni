<!doctype html>
<html lang="ar" dir="rtl" data-theme="fhemni">
<head>
    <script src="/js/analytics.js?v=20260909-3"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to Fhemni to vote on suggested videos and manage your account." data-i18n-content="login.description">
    <title>Sign in — Fhemni</title>
    <link rel="icon" type="image/png" href="/assets/brand/fhemni-icon.png">
    <link rel="stylesheet" href="/css/dist.css?v=20260910-31">
</head>
<body class="auth-page" data-i18n-page-title="login.pageTitle">
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<header class="site-header">
    <a class="brand" href="/" aria-label="Fhemni home" data-i18n-aria-label="common.brandHome">
        <img class="brand-logo brand-logo-full" src="/assets/brand/fhemni-logo.png" alt="Fhemni">
        <img class="brand-logo brand-logo-icon" src="/assets/brand/fhemni-icon.png" alt="Fhemni">
    </a>
    <div class="header-actions">
        <label class="site-language">
            <span class="sr-only" data-i18n="common.siteLanguage">Website language</span>
            <select data-site-language data-i18n-aria-label="common.siteLanguage" aria-label="Website language">
                <option value="en">EN</option>
                <option value="fr">FR</option>
                <option value="ar">الدارجة</option>
            </select>
        </label>
    </div>
</header>

<main class="auth-main">
    <section class="auth-card">
        <div class="eyebrow"><span></span><span class="eyebrow-text" data-i18n="login.eyebrow">Your conversations</span></div>
        <h1 id="loginTitle" data-i18n="login.title">Sign in when you want to participate.</h1>
        <p id="loginIntro" data-i18n="login.intro">Reading is public. An account is only used for private questions, suggestions, and fair voting.</p>
        <div id="loginProviders" class="login-providers" aria-live="polite">
            <span class="auth-unavailable" data-i18n="login.loading">Loading sign-in options…</span>
        </div>
        <p id="loginError" class="landing-error" hidden data-i18n="login.error">Sign-in could not be completed. Please try again.</p>
        <p class="privacy-note" data-i18n="login.privacy">Fhemni never receives or stores your Google or GitHub password.</p>
    </section>
</main>

<script src="/js/i18n.js?v=20260910-11" defer></script>
<script src="/js/auth.js?v=20260906-3" defer></script>
<script src="/js/login.js" defer></script>
</body>
</html>
