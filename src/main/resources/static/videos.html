<!doctype html>
<html lang="ar" dir="rtl" data-theme="fhemni">
<head>
    <script src="/js/analytics.js?v=20260906-2"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse Fhemni's catalogue of Moroccan public-affairs videos." data-i18n-content="catalog.description">
    <title>Video catalogue — Fhemni</title>
    <link rel="icon" type="image/png" href="/assets/brand/fhemni-icon.png">
    <link rel="stylesheet" href="/css/dist.css?v=20260908-13">
</head>
<body class="public-page" data-i18n-page-title="catalog.pageTitle">
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<header class="site-header public-header">
    <a class="brand" href="/" aria-label="Fhemni home" data-i18n-aria-label="common.brandHome">
        <img class="brand-logo brand-logo-full" src="/assets/brand/fhemni-logo.png" alt="">
        <img class="brand-logo brand-logo-icon" src="/assets/brand/fhemni-icon.png" alt="">
    </a>
    <nav class="primary-nav" aria-label="Primary navigation" data-i18n-aria-label="common.primaryNavigation">
        <a class="active" href="/videos" data-i18n="common.catalogue">Catalogue</a>
        <a href="/parties" data-i18n="common.parties">Parties</a>
        <a href="/#how-it-works" data-i18n="common.howItWorks">How it works</a>
    </nav>
    <div class="header-actions">
        <label class="site-language"><span class="sr-only" data-i18n="common.siteLanguage">Website language</span><select data-site-language data-i18n-aria-label="common.siteLanguage" aria-label="Website language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">الدارجة</option></select></label>
        <div id="authNav"></div>
    </div>
</header>

<main>
    <section class="catalog-hero">
        <div class="eyebrow"><span></span><span class="eyebrow-text" data-i18n="catalog.eyebrow">The public catalogue</span></div>
        <h1 data-i18n="catalog.title">Browse the episodes.</h1>
    </section>

    <form id="catalogFilters" class="catalog-filters" role="search">
        <label class="search-control">
            <span class="sr-only" data-i18n="catalog.searchLabel">Search videos</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="catalogSearch" type="search" data-i18n-placeholder="catalog.searchPlaceholder" placeholder="Search titles, shows, or channels">
        </label>
        <label class="filter-control"><span data-i18n="catalog.language">Language</span><select id="catalogLanguage"><option value="" data-i18n="catalog.allLanguages">All languages</option><option value="ary" data-i18n="catalog.darija">Moroccan Darija</option><option value="fr" data-i18n="catalog.french">French</option><option value="en" data-i18n="catalog.english">English</option></select></label>
        <button class="secondary-button" type="submit" data-i18n="catalog.applyFilters">Apply</button>
    </form>

    <section class="catalog-results catalog-results-with-suggestion" aria-labelledby="catalogResultsTitle">
        <div class="catalog-result-heading"><h2 id="catalogResultsTitle" data-i18n="catalog.episodes">Episodes</h2><span id="catalogCount"></span></div>
        <div id="catalogVideos" class="catalog-grid" aria-live="polite"><div class="catalog-loading" data-i18n="catalog.loading">Loading the catalogue…</div></div>
        <nav id="catalogPagination" class="catalog-pagination" aria-label="Catalogue pages" data-i18n-aria-label="catalog.pagination"></nav>
    </section>

    <section class="suggestion-panel catalog-suggestion-panel" aria-labelledby="suggestionTitle">
        <div class="suggestion-copy">
            <h2 id="suggestionTitle" data-i18n="catalog.suggestionTitle">Suggest an episode.</h2>
            <p data-i18n="catalog.suggestionText">Send it to the community and help choose what Fhemni analyses next.</p>
            <a class="secondary-button button-link suggestion-community-link" href="/community" data-i18n="catalog.viewCommunity">Suggest or vote</a>
        </div>
    </section>
</main>

<footer><img class="footer-logo" src="/assets/brand/fhemni-logo.png" alt="Fhemni — فهّمني"><span data-i18n="common.footer">© 2026 Mohammed Aboullaite</span><a class="footer-feedback-link" href="https://github.com/aboullaite/fhemni/issues" target="_blank" rel="noopener noreferrer" data-i18n="common.suggestFeature">Suggest a feature</a></footer>
<script src="/js/i18n.js?v=20260908-2" defer></script><script src="/js/auth.js?v=20260906-3" defer></script><script src="/js/catalog-ui.js?v=20260906-2" defer></script><script src="/js/catalog.js" defer></script>
</body>
</html>
