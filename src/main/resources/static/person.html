<!doctype html>
<html lang="ar" dir="rtl" data-theme="fhemni">
<head>
    <script src="/js/analytics.js?v=20260909-3"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Episodes, statements and passages to compare for a recurring guest." data-i18n-content="person.description">
    <title>Guest — Fhemni</title>
    <link rel="icon" type="image/png" href="/assets/brand/fhemni-icon.png">
    <link rel="stylesheet" href="/css/dist.css?v=20260910-30">
</head>
<body class="public-page" data-i18n-page-title="person.pageTitle">
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<header class="site-header public-header">
    <a class="brand" href="/" aria-label="Fhemni home" data-i18n-aria-label="common.brandHome">
        <img class="brand-logo brand-logo-full" src="/assets/brand/fhemni-logo.png" alt="">
        <img class="brand-logo brand-logo-icon" src="/assets/brand/fhemni-icon.png" alt="">
    </a>
    <nav class="primary-nav" aria-label="Primary navigation" data-i18n-aria-label="common.primaryNavigation">
        <a href="/videos" data-i18n="common.catalogue">Catalogue</a>
        <a class="active" href="/parties" data-i18n="common.parties">Parties</a>
        <a href="/#how-it-works" data-i18n="common.howItWorks">How it works</a>
    </nav>
    <div class="header-actions">
        <label class="site-language"><span class="sr-only" data-i18n="common.siteLanguage">Website language</span><select data-site-language data-i18n-aria-label="common.siteLanguage" aria-label="Website language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">الدارجة</option></select></label>
        <div id="authNav"></div>
    </div>
</header>

<main>
    <div id="personLoading" class="catalog-loading detail-loading" data-i18n="person.loading">Loading this guest…</div>
    <section id="personDetail" class="video-detail" hidden>
        <a class="back-link" href="/parties">← <span data-i18n="person.back">Back to parties</span></a>
        <div class="video-detail-heading">
            <div>
                <div id="personParty" class="section-kicker"></div>
                <h1 id="personName" dir="auto"></h1>
                <div id="personAffiliation" class="video-meta"></div>
                <div id="personStats" class="person-stats"></div>
                <div id="personTopics" class="mt-4"></div>
            </div>
        </div>

        <section class="profile-section" aria-labelledby="personEpisodesTitle">
            <div class="catalog-result-heading"><h2 id="personEpisodesTitle" data-i18n="person.episodes">Episodes</h2><span id="personEpisodesCount"></span></div>
            <div id="personEpisodes" class="catalog-grid"></div>
        </section>

        <section class="profile-section" aria-labelledby="personStatementsTitle">
            <div class="catalog-result-heading"><h2 id="personStatementsTitle" data-i18n="person.statements">What they said</h2><span id="personStatementsCount"></span></div>
            <div id="personStatements" class="catalog-grid"></div>
        </section>

        <section id="personComparisonsSection" class="profile-section" aria-labelledby="personComparisonsTitle" hidden>
            <div class="catalog-result-heading"><h2 id="personComparisonsTitle" data-i18n="person.comparisons">Passages to compare</h2></div>
            <p class="video-meta" data-i18n="person.comparisonsIntro"></p>
            <div id="personComparisons" class="catalog-grid"></div>
        </section>

        <section id="personCrossSection" class="profile-section" aria-labelledby="personCrossTitle" hidden>
            <div class="catalog-result-heading"><h2 id="personCrossTitle" data-i18n="person.crossComparisons">Same topic, other guests</h2></div>
            <p class="video-meta" data-i18n="person.crossComparisonsIntro"></p>
            <div id="personCrossComparisons" class="catalog-grid"></div>
        </section>
    </section>
    <section id="personError" class="catalog-error detail-loading" hidden></section>
</main>

<footer><img class="footer-logo" src="/assets/brand/fhemni-logo.png" alt="Fhemni — فهّمني"><a href="https://x.com/laytoun" target="_blank" rel="me noopener noreferrer" title="@laytoun on X" data-i18n="common.footer">© 2026 Mohammed Aboullaite</a><a class="footer-feedback-link" href="https://github.com/aboullaite/fhemni/issues" target="_blank" rel="noopener noreferrer" data-i18n="common.suggestFeature">Suggest a feature</a></footer>
<script src="/js/i18n.js?v=20260910-1" defer></script><script src="/js/auth.js" defer></script><script src="/js/catalog-ui.js?v=20260906-2" defer></script><script src="/js/people-ui.js?v=20260910-1" defer></script><script src="/js/person.js?v=20260906-2" defer></script>
</body>
</html>
